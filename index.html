/* ── tokens ── */
:root {
  --bg:          #0e1117;
  --bg2:         #161c27;
  --bg3:         #1e2635;
  --border:      #2a3347;
  --fg:          #e8ecf4;
  --fg2:         #8a95a8;
  --fg3:         #4a5568;
  --funder:      #4ade80;
  --pac:         #f59e0b;
  --cand-sup:    #60a5fa;
  --cand-opp:    #f87171;
  --cand-mixed:  #a78bfa;
  --edge-fund:   rgba(74,222,128,.35);
  --edge-pac:    rgba(245,158,11,.45);
  --edge-sup:    rgba(96,165,250,.5);
  --edge-opp:    rgba(248,113,113,.5);
  --orb-bg:      rgba(14,17,23,.94);
  --font-display: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:    'IBM Plex Mono', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:    #f4f6fb;
    --bg2:   #ffffff;
    --bg3:   #eaeff8;
    --border:#c8d3e8;
    --fg:    #111827;
    --fg2:   #4a5568;
    --fg3:   #9ca3af;
    --funder:#16a34a;
    --pac:   #d97706;
    --cand-sup:#2563eb;
    --cand-opp:#dc2626;
    --cand-mixed:#7c3aed;
    --edge-fund: rgba(22,163,74,.3);
    --edge-pac:  rgba(217,119,6,.35);
    --edge-sup:  rgba(37,99,235,.4);
    --edge-opp:  rgba(220,38,38,.4);
    --orb-bg:    rgba(244,246,251,.96);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:    #f4f6fb;
  --bg2:   #ffffff;
  --bg3:   #eaeff8;
  --border:#c8d3e8;
  --fg:    #111827;
  --fg2:   #4a5568;
  --fg3:   #9ca3af;
  --funder:#16a34a;
  --pac:   #d97706;
  --cand-sup:#2563eb;
  --cand-opp:#dc2626;
  --cand-mixed:#7c3aed;
  --edge-fund: rgba(22,163,74,.3);
  --edge-pac:  rgba(217,119,6,.35);
  --edge-sup:  rgba(37,99,235,.4);
  --edge-opp:  rgba(220,38,38,.4);
  --orb-bg:    rgba(244,246,251,.96);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-display); overflow: hidden; }

#header {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
#header h1 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg); white-space: nowrap; }
#header .sub { font-size: 11px; color: var(--fg2); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#header-spacer { flex: 1; }

#legend { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--fg2); white-space: nowrap; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

#reset-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--fg2);
  font-family: var(--font-mono); font-size: 10px; padding: 4px 10px;
  border-radius: 4px; cursor: pointer; white-space: nowrap;
  transition: color .15s, border-color .15s;
}
#reset-btn:hover { color: var(--fg); border-color: var(--fg2); }

#canvas-wrap { position: fixed; inset: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 45px); }
#canvas-wrap svg { width: 100%; height: 100%; display: block; }

.tier-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; fill: var(--fg3); pointer-events: none; }

.edge { fill: none; stroke-linecap: round; cursor: pointer; transition: stroke-opacity .2s; }
.edge:hover { stroke-opacity: 1 !important; }

.node { cursor: pointer; }
.node circle { stroke-width: 1.5px; transition: r .2s, stroke-width .2s; }
.node:hover circle { stroke-width: 2.5px; }
.node-label { font-family: var(--font-display); font-size: 8px; fill: var(--fg2); pointer-events: none; text-anchor: middle; }
.node-label.dense { font-size: 7px; fill: var(--fg3); }

#orb-overlay { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: flex; align-items: center; justify-content: center; }
#orb {
  pointer-events: all;
  width: min(480px, 92vw);
  background: var(--orb-bg);
  border: 1px solid var(--border);
  border-radius: 50%;
  aspect-ratio: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px; text-align: center; gap: 10px;
  box-shadow: 0 0 0 8px var(--bg), 0 0 60px rgba(0,0,0,.4);
  opacity: 0; transform: scale(.5);
  transition: opacity .3s cubic-bezier(.34,1.56,.64,1), transform .3s cubic-bezier(.34,1.56,.64,1);
  overflow: hidden;
}
#orb.open { opacity: 1; transform: scale(1); }
#orb-tier { font-family: var(--font-mono); font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg3); }
#orb-name { font-size: clamp(14px, 3.5vw, 22px); font-weight: 600; color: var(--fg); line-height: 1.2; text-wrap: balance; }
.orb-race { font-weight: 400; opacity: .75; white-space: nowrap; }
#orb-total { font-family: var(--font-mono); font-size: clamp(20px, 5vw, 32px); font-weight: 500; letter-spacing: -.01em; }
#orb-detail { font-size: 11px; color: var(--fg2); line-height: 1.55; white-space: pre-wrap; max-width: 280px; }
#orb-profile { font-size: 11px; color: var(--fg2); line-height: 1.6; max-width: 290px; border-top: 1px solid var(--border); padding-top: 10px; font-style: italic; }
#orb-close { position: absolute; top: 22%; right: 22%; background: none; border: none; color: var(--fg3); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px; transition: color .15s; }
#orb-close:hover { color: var(--fg); }

#edge-tip { position: fixed; z-index: 25; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: var(--font-mono); font-size: 11px; color: var(--fg); pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .15s; }
#edge-tip.show { opacity: 1; }

#stats-panel {
  position: fixed;
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 20; width: 220px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; font-size: 11px; transition: opacity .2s;
}
#stats-panel h3 { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg3); margin-bottom: 10px; }
.stat-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--fg2); }
.stat-row:last-child { border-bottom: none; }
.stat-val { font-family: var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }


/* ── info sheet (opens when the name in the pop-up is clicked) ── */
#orb-name.has-sheet { cursor: pointer; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 4px; }
#orb-name.has-sheet:hover, #orb-name.has-sheet:focus-visible { text-decoration-style: solid; outline: none; }
#orb-hint { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg3); }
#sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
  width: min(460px, 100vw);
  background: var(--bg2); border-left: 1px solid var(--border);
  box-shadow: -12px 0 40px rgba(0,0,0,.35);
  overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) 20px;

#sheet-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
#sheet-bar button { background: none; border: 1px solid var(--border); color: var(--fg2); font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
#sheet-bar button:hover, #sheet-bar button:focus-visible { color: var(--fg); border-color: var(--fg2); outline: none; }
#sheet-close { font-size: 16px !important; line-height: 1; }
.sh-eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg3); }
.sh-title { font-size: 22px; font-weight: 600; line-height: 1.2; margin-top: 6px; text-wrap: balance; }
.sh-sub { font-size: 13px; color: var(--fg2); margin-top: 4px; }
.sh-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 18px; }
.sh-stat { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.sh-stat-k { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; }
.sh-stat-v { font-family: var(--font-mono); font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.sh-section { margin-top: 22px; }
.sh-h { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg3); padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.sh-text { font-size: 13px; line-height: 1.6; color: var(--fg); white-space: pre-wrap; }
.sh-empty { font-size: 12px; color: var(--fg3); font-style: italic; }
.sh-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.sh-row:last-child { border-bottom: none; }
.sh-row-name { min-width: 0; overflow-wrap: anywhere; }
.sh-row-meta { grid-column: 1 / -1; font-size: 11px; color: var(--fg3); }
.sh-amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sh-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; margin-left: 6px; border: 1px solid currentColor; }
.sh-tag.support { color: var(--cand-sup); }
.sh-tag.against { color: var(--cand-opp); }
.sh-tag.transfer { color: var(--pac); }
.sh-link { background: none; border: none; padding: 0; font: inherit; color: var(--cand-sup); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.sh-link:hover, .sh-link:focus-visible { color: var(--fg); outline: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media (max-width: 600px) {
  #legend { display: none; }
  #stats-panel { width: 160px; font-size: 10px; }
}

};

  // ── helpers ──
  const fmt = v => {
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
    if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
    return '$' + Math.round(v).toLocaleString();
  };

  // ── state ──
  let network = null;
  let svg, g, zoom;
  let orbOpen = false;

  // ── init ──
  function start() {
    network = NETWORK_DATA;
    const m = network.meta || {};
    document.getElementById('st-funded').textContent  = m.total_funded   || '—';
    document.getElementById('st-spent').textContent   = m.total_spent_ie || '—';
    document.getElementById('st-funders').textContent = m.n_funders != null ? m.n_funders : '—';
    document.getElementById('st-cands').textContent   = m.n_candidates != null ? m.n_candidates : '—';
    document.getElementById('st-period').textContent  = m.date_range || '—';

    const wrap = document.getElementById('canvas-wrap');
    const W = wrap.clientWidth, H = wrap.clientHeight;

    svg = d3.select('#svg');
    g = svg.append('g');

    zoom = d3.zoom()
      .scaleExtent([0.2, 8])
      .on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom);
    svg.on('click', function (e) {
      if (e.target === this || e.target.tagName === 'svg') closeOrb();
    });

    document.getElementById('reset-btn').addEventListener('click', () => resetView(true));

    buildGraph(W, H);
    resetView(false);
  }

  function buildGraph(W, H) {
    const nodes = network.nodes;
    const edges = network.edges;

    const MARGIN = 0.05;
    const tiers = { Funders: 0.15, PACs: 0.5, Candidates: 0.85 };

    const byTier = { Funders: [], PACs: [], Candidates: [] };
    nodes.forEach(n => {
      const row = n.tier === 'Measures' ? 'Candidates' : n.tier;
      if (byTier[row]) byTier[row].push(n);
    });

    Object.keys(byTier).forEach(t => byTier[t].sort((a, b) => b.total - a.total));

    const PAC_SPREAD = 0.5;
    const ARC = 0.18;
    const nodePos = {};

    Object.keys(byTier).forEach(tier => {
      const arr = byTier[tier];
      const n = arr.length;
      const isPAC = tier === 'PACs';
      const ml = isPAC ? (1 - PAC_SPREAD) / 2 : MARGIN;
      const mr = isPAC ? 1 - ml : 1 - MARGIN;
      const yBase = tiers[tier];

      if (tier === 'Candidates') {
        const measures = arr.filter(d => d.id.startsWith('CAND|Measure:'));
        const people   = arr.filter(d => !d.id.startsWith('CAND|Measure:'));
        arr.length = 0;
        arr.push(...measures, ...people);
      }

      arr.forEach((nd, i) => {
        const t  = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
        const x  = (n === 1 ? 0.5 : ml + (i / (n - 1)) * (mr - ml)) * W;
        const dy = isPAC ? 0 : Math.pow(t, 2) * ARC * H * (tier === 'Funders' ? -1 : 1);
        const y  = yBase * H + dy;
        nodePos[nd.id] = { x, y };
        nd.x = x; nd.y = y;
      });
    });

    // tier labels
    const labelY = { Funders: 0.06, PACs: 0.53, Candidates: 0.93 };
    Object.keys(labelY).forEach(t => {
      g.append('text')
        .attr('class', 'tier-label')
        .attr('x', W / 2)
        .attr('y', labelY[t] * H)
        .attr('text-anchor', 'middle')
        .text(t.toUpperCase());
    });

    const maxTotal = d3.max(nodes, d => d.total) || 1;
    const rScale = d3.scaleSqrt().domain([0, maxTotal]).range([4, 22]);

    const edgeColors = {
      'Funder to PAC':       'var(--edge-fund)',
      'PAC to PAC':          'var(--edge-pac)',
      'Supports candidate':  'var(--edge-sup)',
      'Opposes candidate':   'var(--edge-opp)'
    };
    const maxAmt = d3.max(edges, e => e.amount) || 1;
    const wScale = d3.scaleSqrt().domain([0, maxAmt]).range([0.6, 5]);

    const tip = document.getElementById('edge-tip');

    edges.forEach(e => {
      const s = nodePos[e.source], t2 = nodePos[e.target];
      if (!s || !t2) return;

      const isPacPac = e.type === 'pac_pac';
      let path;

      if (isPacPac) {
        const mx = (s.x + t2.x) / 2;
        const my = Math.min(s.y, t2.y) - 60;
        path = g.append('path').attr('d', `M${s.x},${s.y} Q${mx},${my} ${t2.x},${t2.y}`);
      } else {
        path = g.append('line').attr('x1', s.x).attr('y1', s.y).attr('x2', t2.x).attr('y2', t2.y);
      }

      path.attr('class', 'edge')
        .attr('stroke', edgeColors[e.edge_kind] || 'var(--edge-fund)')
        .attr('stroke-width', wScale(e.amount))
        .attr('stroke-opacity', 0.6)
        .on('mouseenter', function (ev) { tip.textContent = e.label; tip.classList.add('show'); moveTip(ev); })
        .on('mousemove', moveTip)
        .on('mouseleave', () => tip.classList.remove('show'))
        .on('click', function (ev) {
          ev.stopPropagation();
          tip.textContent = e.label;
          tip.classList.add('show');
          moveTip(ev);
          setTimeout(() => tip.classList.remove('show'), 2200);
        });
    });

    function moveTip(ev) {
      const x = ev.clientX + 12, y = ev.clientY - 28;
      tip.style.left = Math.min(x, window.innerWidth - 220) + 'px';
      tip.style.top  = y + 'px';
    }

    const nodeColors = {
      Funders:    'var(--funder)',
      PACs:       'var(--pac)',
      Candidates: nd => {
        const incoming = edges.filter(e => e.target === nd.id && e.type === 'pac_candidate');
        const sums = { S: 0, O: 0 };
        incoming.forEach(e => { sums[e.sup_opp] = (sums[e.sup_opp] || 0) + e.amount; });
        if (sums.S > 0 && sums.O > 0) return 'var(--cand-mixed)';
        if (sums.O > 0) return 'var(--cand-opp)';
        return 'var(--cand-sup)';
      }
    };

    const tierIndex = {};
    nodes.forEach(nd => {
      if (tierIndex[nd.tier] === undefined) tierIndex[nd.tier] = 0;
      nd._tierIdx = tierIndex[nd.tier]++;
    });

    nodes.forEach(nd => {
      const pos = nodePos[nd.id];
      if (!pos) return;
      const r = rScale(nd.total);
      const tierKey = nd.tier === 'Measures' ? 'Candidates' : nd.tier;
      const col = typeof nodeColors[tierKey] === 'function'
        ? nodeColors[tierKey](nd)
        : (nodeColors[tierKey] || 'var(--fg2)');

      const grp = g.append('g')
        .attr('class', 'node')
        .attr('transform', `translate(${pos.x},${pos.y})`)
        .on('click', ev => { ev.stopPropagation(); openOrb(nd, col, edges); });

      grp.append('circle')
        .attr('r', r)
        .attr('fill', col)
        .attr('fill-opacity', 0.15)
        .attr('stroke', col);

      const tierCount = (byTier[tierKey] || []).length;
      const isDense = tierCount > 20;
      const maxChars = isDense ? 10 : 14;
      const labelText = displayLabel(nd);
      const lines = wrapLabel(labelText, maxChars);
      const labelGrp = grp.append('text').attr('class', isDense ? 'node-label dense' : 'node-label');
      const above = nd._tierIdx % 2 === 1;
      const lineH = isDense ? 9 : 11;
      const baseOff = above ? -(r + 5 + (lines.length - 1) * lineH) : r + 9;
      lines.forEach((ln, i) => {
        labelGrp.append('tspan').attr('x', 0).attr('dy', i === 0 ? baseOff : '1.2em').text(ln);
      });
    });
  }

  // ballot measures are stored as candidates with a "Measure: " prefix
  function isMeasure(nd) {
    return /^CAND\|Measure:/i.test(nd.id) || /^Measure:/i.test(nd.label || '');
  }
  // committees (e.g. Uber Innovation PAC) that appear in the candidate row
  function isCommittee(nd) {
    return nd.kind === 'committee' ||
      (/^CAND\|/.test(nd.id) && /\b(PAC|COMMITTEE|POLITICAL ACTION|INDEPENDENT EXPENDITURE)\b/i.test(nd.label || ''));
  }
  // node + orb label: drop the "Measure: " prefix, so props show as "Proposition 41"
  function displayLabel(nd) {
    return (nd.label || nd.id).replace(/^Measure:\s*/i, '');
  }

  function wrapLabel(text, maxLen) {
    if (text.length <= maxLen) return [text];
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    words.forEach(w => {
      if ((cur + ' ' + w).trim().length > maxLen && cur) { lines.push(cur); cur = w; }
      else { cur = (cur + ' ' + w).trim(); }
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  }

  function openOrb(nd, col, edges) {
    const orb = document.getElementById('orb');
    document.getElementById('orb-tier').textContent = isMeasure(nd) ? 'MEASURES'
      : isCommittee(nd) ? 'GENERAL PURPOSE COMMITTEE' : nd.tier.toUpperCase();
    // name line: "Annalisa Perea (D) | AD31" (party and race come from candidate_info.csv)
    const nameEl = document.getElementById('orb-name');
    const committee = isCommittee(nd);   // committees get no party or race
    nameEl.textContent = displayLabel(nd) + (nd.party && !committee ? ' (' + nd.party + ')' : '');
    if (nd.race && !committee) {
      const raceEl = document.createElement('span');
      raceEl.className = 'orb-race';
      raceEl.textContent = ' | ' + nd.race;
      nameEl.appendChild(raceEl);
    }
    document.getElementById('orb-name').style.color = col;
    document.getElementById('orb-total').textContent = nd.total > 0 ? fmt(nd.total) : '—';
    document.getElementById('orb-total').style.color = col;
    // committees: add the candidates they support (from committee_support.csv)
    document.getElementById('orb-detail').textContent = (nd.detail || '') +
      (isCommittee(nd) ? '\n\nSupports: ' + (nd.supports || 'no candidates found in its Cal-Access filings') : '');
    document.getElementById('orb-profile').hidden = true;
    orb.classList.add('open');
    orbOpen = true;

    // name opens the info sheet when one exists for this node
    const hasSheet = !!sheetFor(nd.id);
    nameEl.classList.toggle('has-sheet', hasSheet);
    nameEl.tabIndex = hasSheet ? 0 : -1;
    nameEl.setAttribute('role', hasSheet ? 'button' : '');
    nameEl.onclick = hasSheet ? (() => openSheet(nd.id, true)) : null;
    nameEl.onkeydown = hasSheet ? (e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(nd.id, true); } }) : null;
    document.getElementById('orb-hint').hidden = !hasSheet;
    zoomToNode(nd);
  }

  function closeOrb() {
    document.getElementById('orb').classList.remove('open');
    orbOpen = false;
  }


  // ── info sheets ──
  // Built in R (section 9b) and baked into the page as network.sheets, keyed by node id.
  // Manual fields (industry, politics, mission, policy platform, what it does) come from
  // output/additional_info.csv; empty ones show "Not yet added".
  const sheetHistory = [];
  const fmtFull = v => '$' + Math.round(v || 0).toLocaleString('en-US');
  const EYEBROW = { candidate: 'Candidate', measure: 'Measure', committee: 'General purpose committee',
                    funder: 'Funder', pac: 'PAC' };

  function sheetFor(id) { return network && network.sheets ? network.sheets[id] : null; }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function nameNode(id, name) {          // linked if that entity has its own sheet
    if (id && sheetFor(id)) {
      const b = el('button', 'sh-link', name);
      b.addEventListener('click', () => openSheet(id, true));
      return b;
    }
    return el('span', '', name);
  }
  function section(body, title) {
    const sec = el('div', 'sh-section');
    sec.appendChild(el('div', 'sh-h', title));
    body.appendChild(sec);
    return sec;
  }
  function textField(body, title, value) {
    const sec = section(body, title);
    sec.appendChild(value ? el('div', 'sh-text', value) : el('div', 'sh-empty', 'Not yet added'));
  }
  function stats(body, pairs) {
    const g = el('div', 'sh-stats');
    pairs.forEach(([k, v]) => { const s = el('div', 'sh-stat'); s.appendChild(el('div', 'sh-stat-k', k)); s.appendChild(el('div', 'sh-stat-v', v)); g.appendChild(s); });
    body.appendChild(g);
  }
  function list(body, title, rows, opts = {}) {
    const sec = section(body, title);
    if (!rows || !rows.length) { sec.appendChild(el('div', 'sh-empty', opts.empty || 'None in the tracked PACs\' filings')); return; }
    rows.forEach(r => {
      const row = el('div', 'sh-row');
      const left = el('div', 'sh-row-name');
      left.appendChild(nameNode(r.id, r.name));
      if (r.dir) left.appendChild(el('span', 'sh-tag ' + r.dir, r.dir));
      row.appendChild(left);
      row.appendChild(el('div', 'sh-amt', fmtFull(r.amount)));
      if (opts.meta) row.appendChild(el('div', 'sh-row-meta', opts.meta(r)));
      sec.appendChild(row);
    });
  }

  function renderSheet(id) {
    const S = sheetFor(id);
    const body = document.getElementById('sheet-body');
    body.replaceChildren();
    if (!S) { body.appendChild(el('div', 'sh-empty', 'No info sheet for this entry.')); return; }

    body.appendChild(el('div', 'sh-eyebrow', EYEBROW[S.type] || S.type));
    body.appendChild(el('h2', 'sh-title', S.name));

    if (S.type === 'candidate') {
      const sub = [S.party ? '(' + S.party + ')' : '', S.race || ''].filter(Boolean).join(' | ');
      if (sub) body.appendChild(el('div', 'sh-sub', sub));
      stats(body, [['IEs supporting', fmtFull(S.support)], ['IEs against', fmtFull(S.against)]]);
      textField(body, 'Policy platform', S.policy_platform);
      list(body, 'Spending breakdown (tracked PACs)', S.spending);
    } else if (S.type === 'funder') {
      stats(body, [['Given to tracked PACs', fmtFull(S.total)]]);
      textField(body, 'Industry', S.industry);
      textField(body, 'Politics', S.politics);
      list(body, 'Spending breakdown (tracked PACs)', S.spending);
    } else if (S.type === 'pac') {
      stats(body, [['Raised', fmtFull(S.raised)], ['Spent on IEs', fmtFull(S.spent)]]);
      textField(body, 'Mission', S.mission);
      list(body, 'Top funders', S.top_funders, { meta: r => 'Industry: ' + (r.industry || 'not yet added') });
      list(body, 'Spending breakdown', S.spending);
      list(body, 'Fundraising breakdown', S.fundraising);
    } else if (S.type === 'measure') {
      textField(body, 'What it does', S.what_it_does);
      list(body, 'Spending breakdown (tracked PACs)', S.spending);
    } else if (S.type === 'committee') {
      list(body, 'Funding breakdown (tracked PACs)', S.spending);
      const sec = section(body, 'Who they support');
      if (S.supports && S.supports.length) S.supports.forEach(t => sec.appendChild(el('div', 'sh-row', t)));
      else sec.appendChild(el('div', 'sh-empty', 'No candidates found in its Cal-Access filings'));
    }
  }

  function openSheet(id, push) {
    const panel = document.getElementById('sheet');
    if (push) {
      if (panel.hidden) sheetHistory.length = 0;
      if (sheetHistory[sheetHistory.length - 1] !== id) sheetHistory.push(id);
    }
    renderSheet(id);
    panel.hidden = false;
    panel.scrollTop = 0;
    document.getElementById('sheet-back').hidden = sheetHistory.length < 2;
    document.getElementById('sheet-close').focus({ preventScroll: true });
  }
  function closeSheet() {
    document.getElementById('sheet').hidden = true;
    sheetHistory.length = 0;
  }
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('sheet-back').addEventListener('click', () => {
    sheetHistory.pop();
    if (sheetHistory.length) openSheet(sheetHistory[sheetHistory.length - 1], false); else closeSheet();
  });
  document.getElementById('sheet').addEventListener('click', e => e.stopPropagation());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });

  document.getElementById('orb-close').addEventListener('click', closeOrb);
  document.getElementById('orb').addEventListener('click', e => e.stopPropagation());

  function zoomToNode(nd) {
    const wrap = document.getElementById('canvas-wrap');
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const scale = 2.2;
    const tx = W / 2 - scale * nd.x;
    const ty = H / 2 - scale * nd.y;
    svg.transition().duration(500).ease(d3.easeCubicInOut)
      .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }

  function resetView(animate) {
    svg.transition().duration(animate ? 450 : 0).ease(d3.easeCubicInOut)
      .call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(1));
    if (orbOpen) closeOrb();
  }

  start();
})();
</script>
